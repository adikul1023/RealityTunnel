services:
  marzban:
    image: gozargah/marzban:latest
    restart: always
    env_file: .env
    # Lab only: expose Marzban on the Windows host for local testing.
    ports:
      - "8000:8000"
      - "443:443"
    volumes:
      # Lab only: keep Marzban state in the workspace so container recreation does not lose data.
      - ../data/marzban:/var/lib/marzban
      # Lab only: self-signed certs let the official image bind over HTTPS on Docker Desktop.
      - ../configs/certs:/certs:ro
