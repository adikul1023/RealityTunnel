name: Docker Build & Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build Image & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Production Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          tags: billing-server-billing-api:test
          load: true
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
            VERSION=1.0.0

      - name: Start Production Compose Environment
        env:
          POSTGRES_PASSWORD: testpassword123
          JWT_SECRET: supersecretproductiontestkey1234567890
          DOCKER_IMAGE: billing-server-billing-api:test
          APP_VERSION: 1.0.0
          GIT_COMMIT: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for Health Endpoint Green
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health | grep -q "version"; do sleep 2; done'
          curl -s http://localhost:8080/health | jq .

      - name: Set up Python for Smoke Tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Smoke Test Dependencies
        run: |
          pip install pytest httpx pydantic

      - name: Run Production Smoke Test Suite
        env:
          TARGET_URL: http://localhost:8080
          ENVIRONMENT: production
        run: |
          pytest tests/smoke/ -v

      - name: Dump Compose Logs on Failure
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml logs
