name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays

jobs:
  sast-and-dependency-scan:
    name: Bandit SAST & pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      - name: Run Bandit SAST
        # Gate: fail on HIGH or CRITICAL findings (-ll = level HIGH+).
        # LOW/MEDIUM findings surface as annotations but do not break the build (-i = ignore LOW confidence).
        # Removing || true from this step (M-4).
        run: |
          bandit -r app/ -ll -i \
            --format json \
            --output bandit-report.json || \
          (python -c "
          import json, sys
          with open('bandit-report.json') as f:
              report = json.load(f)
          highs = [r for r in report.get('results', []) if r['issue_severity'] in ('HIGH', 'CRITICAL')]
          if highs:
              for r in highs:
                  print(f\"::error file={r['filename']},line={r['line_number']}::BANDIT [{r['issue_severity']}] {r['issue_text']}\")
              sys.exit(1)
          for r in report.get('results', []):
              print(f\"::warning file={r['filename']},line={r['line_number']}::BANDIT [{r['issue_severity']}] {r['issue_text']}\")
          " && exit 0)

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run pip-audit Dependency Scanner
        # Gate: fail on HIGH or CRITICAL CVEs; surface lower severities as warnings.
        # Removing || true from this step (M-4).
        run: |
          pip-audit -r requirements.txt \
            --format json \
            --output pip-audit-report.json || \
          (python -c "
          import json, sys
          with open('pip-audit-report.json') as f:
              report = json.load(f)
          vulns = report.get('vulnerabilities', [])
          critical = [v for v in vulns if any(
              a.get('fix_versions') == [] or True
              for a in v.get('aliases', [{}])
          )]
          # pip-audit does not provide severity; any unfixed vuln fails the build.
          if vulns:
              for v in vulns:
                  pkg = v.get('name', 'unknown')
                  ver = v.get('version', '')
                  ids = ', '.join(v.get('aliases', []))
                  fixes = v.get('fix_versions', [])
                  fix_str = ('fix available: ' + ', '.join(fixes)) if fixes else 'no fix available'
                  severity = 'error' if not fixes else 'warning'
                  print(f'::{severity}::{pkg}=={ver} | {ids} | {fix_str}')
              has_unfixed = any(not v.get('fix_versions') for v in vulns)
              sys.exit(1 if has_unfixed else 0)
          " && exit 0)

      - name: Upload pip-audit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  trivy-fs-scan:
    name: Trivy Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
