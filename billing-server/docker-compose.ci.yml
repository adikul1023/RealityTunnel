services:
  billing-api:
    environment:
      ENVIRONMENT: testing
      PAYMENTS_ENABLED: "false"
      PROVISIONING_ENABLED: "false"
      WEBHOOKS_ENABLED: "false"
    volumes:
      - ./dev_keys:/app/dev_keys # Make it writable for testing profile
    ports:
      - "8088:8080" # Map to 8088 to avoid Apache conflict on 8080

  postgres:
    ports:
      - "5433:5432" # Map to 5433 to avoid conflicts
